<div class="container">
    <div class="title-page">
        <span>Produtos</span>
    </div>
    <div class="sub-title-page">
         <span>Gerencie e cadastre os produtos</span>
    </div>

    @if(pagedResult() != null){
        <div class="div-container-body">
            <div class="div-wrapper-button">
                <div class="btn-style" routerLink="/produtos/novo">
                    <div class="wrapper-icon-button">
                        <span class="material-icons" style="font-size: 22px;">
                            add
                        </span>
                    </div>
                    
                    <div class="btn-text">
                        <span>Novo Produto</span>
                    </div>
                </div>
            </div>
        
            <app-custom-grid-component
                  [columns]="gridProdutoColunas"
                  [keyFieldTrack]="'idProduto'"
                  [data]="produtoLista()"
                  [tamanhoPagina]="this.tamanhoPagina",
                  [totalRegistros]="pagedResult().totalRegistros"
                  [pageIndex]="pageIndex()"  
                  (page)="onPageChange($event)"            
            />
                  
        </div>
    }
</div>
